server:
  port: 8082

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cloudops_servicedesk}

gcs:
  bucket-name: ${GCS_BUCKET_ATTACHMENTS:cloudops-ticket-attachments-dev}
  project-id: ${GCP_PROJECT_ID:cloudops-psa-dev}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
